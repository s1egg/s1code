name: Setup APT mirrors
description: Keep Ubuntu package downloads on the GitHub-hosted runner mirrors.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # GitHub-hosted runners already use nearby mirrors. Bound a hung mirror
        # so a slow index does not consume the job.
        printf '%s\n' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' \
          | sudo tee /etc/apt/apt.conf.d/80-mirror-timeouts > /dev/null
